name: Evaluation (live)

# Tier 2 — the expensive half.
#
# Deliberately NOT on push or pull_request. A full recording costs roughly 2,500 of the 10,000
# free Workers AI neurons per day, so wiring it to every push would drain the allocation and take
# the deployed demo down with it — requests hard-fail once the budget is gone. A gate that can
# break the service it guards is not a gate.
#
# The merge-blocking quality gate is Tier 1 (`ci.yml`), which replays these recordings from
# committed fixtures for free. This workflow exists to refresh them.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Write the run to D1 evaluation history"
        type: boolean
        default: true
  schedule:
    # Nightly, off-peak. Catches drift in the deployed models without anyone remembering to look.
    - cron: "17 9 * * *"

concurrency:
  group: eval-live
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  record:
    name: record
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Record against the deployed Worker
        # No Cloudflare credentials needed — recording drives the public chat endpoint, the same
        # path a user drives. That is the point of sharing one code path.
        env:
          WORKER_URL: https://glassbox.glassbox.workers.dev
        run: npm run eval:record

      - name: Replay the fresh recording against committed floors
        run: npm run eval:replay

      - name: Publish run to D1 evaluation history
        # Only the publish step needs a secret, and it is skipped rather than failed when absent
        # so a fork can still record and replay.
        if: ${{ inputs.publish != false && env.INGEST_TOKEN != '' }}
        env:
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
          WORKER_URL: https://glassbox.glassbox.workers.dev
        run: npm run eval:publish

      - name: Open a PR if the fixtures moved
        # Fixtures are never committed straight to main: a change in them is a change in the
        # numbers this project publishes, and that deserves review like any other diff.
        run: |
          if git diff --quiet -- eval/fixtures; then
            echo "fixtures unchanged — nothing to propose" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          BRANCH="eval/refresh-$(git rev-parse --short HEAD)-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add eval/fixtures
          git commit -m "eval: refresh fixtures from live recording

          Recorded against the deployed Worker by the nightly live evaluation.
          Tier 1 replays these to gate every pull request."
          git push origin "$BRANCH"
          gh pr create --title "eval: refresh fixtures from live recording" \
            --body "Automated recording. Tier 1 replay gates the merge — if a floor in \`eval/floors.json\` is breached, this PR cannot merge." \
            --head "$BRANCH"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Summary
        if: always()
        run: |
          {
            echo "### Tier 2 — live evaluation"
            echo ""
            echo "Recorded against the deployed Worker. Costs ~2,500 of 10,000 free neurons/day,"
            echo "which is why this is dispatch/nightly rather than per-push."
          } >> "$GITHUB_STEP_SUMMARY"
