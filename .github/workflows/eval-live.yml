name: Evaluation (live)

# Tier 2 — the expensive half.
#
# Deliberately NOT on push or pull_request. A full recording costs roughly 2,500 of the 10,000
# free Workers AI neurons per day, so wiring it to every push would drain the allocation and take
# the deployed demo down with it — requests hard-fail once the budget is gone. A gate that can
# break the service it guards is not a gate.
#
# The merge-blocking quality gate is Tier 1 (`ci.yml`), which replays committed fixtures for
# free. This workflow answers a different question: has the *deployed* system drifted since those
# fixtures were recorded? It records fresh, replays the fresh recording against the committed
# floors, and fails if any floor breaks. A failure is the alarm, and failures notify.
#
# NOTE: GitHub disables scheduled workflows in public repositories after 60 days without commit
# activity. On a repository that goes quiet, this will stop firing silently.
on:
  workflow_dispatch:
    inputs:
      refresh_fixtures:
        description: "Push the fresh recording to a branch for review"
        type: boolean
        default: false
  schedule:
    # Weekly, Saturdays at 00:20 UTC.
    #
    # Timing: shortly after the 00:00 UTC neuron reset, so the recording draws on a full
    # allocation rather than competing with demo traffic. The first scheduled run went out at
    # 09:17 mid-week, took a quarter of that day's allocation, and by early afternoon the budget
    # was gone and the deployed page was hard-failing for visitors along with it.
    #
    # Cadence: weekly rather than nightly. The deployment is fixed, so day-to-day quality drift
    # is unlikely; what a daily run reliably produced was contention for the one free allocation
    # the demo also draws on. Weekly keeps drift detection while giving the page six clear days.
    # The trade is slower detection, which is the right way round when the failure being watched
    # for is rare and the cost of watching is the service itself going down.
    #
    # Run it by hand any time via workflow_dispatch — that path costs the same but is deliberate.
    - cron: "20 0 * * 6"

concurrency:
  group: eval-live
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  record:
    name: record
    runs-on: ubuntu-latest
    env:
      WORKER_URL: https://glassbox.glassbox.workers.dev
      # Job level, not step level. A step's own `env:` block is not in scope for that step's own
      # `if:` — the condition is evaluated first — so guarding on it there silently skips the
      # step instead of running it. That is exactly how the first nightly run published nothing
      # while reporting success.
      INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Record against the deployed Worker
        # No Cloudflare credentials needed — recording drives the public chat endpoint, the same
        # path a user drives. That is the point of sharing one code path.
        id: record
        run: |
          set +e
          npm run eval:record
          code=$?
          set -e
          # Exit 3 means the daily Workers AI allocation is gone. That is a budget condition,
          # not a quality signal, and failing the run for it would raise an alarm identical to a
          # real regression — which is how people learn to ignore the real one.
          if [ "$code" -eq 3 ]; then
            echo "budget_exhausted=true" >> "$GITHUB_OUTPUT"
            echo "::warning::Daily Workers AI allocation exhausted; recording skipped. Not a quality regression — the allocation resets at 00:00 UTC."
            exit 0
          fi
          exit "$code"

      - name: Replay the fresh recording against committed floors
        # The alarm. If the deployed system has drifted below a floor, this fails the run.
        if: ${{ steps.record.outputs.budget_exhausted != 'true' }}
        run: npm run eval:replay

      - name: Publish run to D1 evaluation history
        if: ${{ env.INGEST_TOKEN != '' && steps.record.outputs.budget_exhausted != 'true' }}
        run: npm run eval:publish

      - name: Warn if the run could not be published
        if: ${{ env.INGEST_TOKEN == '' && steps.record.outputs.budget_exhausted != 'true' }}
        run: |
          echo "::warning::INGEST_TOKEN is unavailable — the run was not written to D1 history." \
            "On a fork this is expected; on this repository it means the secret is missing."

      # Fixtures are NOT auto-proposed on a schedule. They carry per-stage timings, which differ
      # on every run, so a nightly pull request would fire every night and be almost entirely
      # noise — and noise on a review channel trains people to ignore it. Refreshing the recorded
      # baseline is a deliberate act: run this workflow manually with refresh_fixtures, or run
      # `npm run eval:record` locally.
      - name: Push refreshed fixtures for review
        if: ${{ inputs.refresh_fixtures && steps.record.outputs.budget_exhausted != 'true' && !cancelled() }}
        run: |
          if git diff --quiet -- eval/fixtures; then
            echo "Fixtures unchanged — nothing to propose." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          BRANCH="eval/fixture-refresh"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add eval/fixtures
          git commit -m "eval: refresh fixtures from a live recording

          Recorded against the deployed Worker. Tier 1 replays these to gate every pull request,
          so this changes the baseline every future PR is measured against."
          # Force-push a single stable branch rather than one per run, so at most one refresh
          # branch ever exists.
          git push --force origin "$BRANCH"
          {
            echo "### Refreshed fixtures pushed"
            echo ""
            echo "Open a pull request: <${{ github.server_url }}/${{ github.repository }}/compare/${BRANCH}?expand=1>"
            echo ""
            echo "_Creating the pull request is left to a human: GitHub Actions cannot open PRs"
            echo "unless the repository grants it that permission, and this workflow does not"
            echo "need it._"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Summary
        if: always()
        run: |
          {
            echo "### Tier 2 — live evaluation"
            echo ""
            echo "Recorded against the deployed Worker and replayed against \`eval/floors.json\`."
            echo "A failure here means the deployed system drifted below a committed floor."
            echo ""
            echo "Costs ~2,500 of 10,000 free neurons/day, which is why this is weekly rather"
            echo "than per-push. Fixtures are only proposed when run manually with"
            echo "\`refresh_fixtures\`, because they carry timings that differ every run."
            if [ "${{ steps.record.outputs.budget_exhausted }}" = "true" ]; then
              echo ""
              echo "**Skipped: the daily neuron allocation was already gone.** Not a regression;"
              echo "the allocation resets at 00:00 UTC and the committed fixtures are untouched."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
